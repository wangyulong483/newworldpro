# P6-A 涌现通信：控制指称博弈 + 世界内信号通道消融（P5 配置化实验）
# 运行： python -m newworld --config configs/p6_communication.yaml
# 产物： experiments/results/p6_communication/{summary.json,config.yaml}
_base: base.yaml
name: p6_communication
protocol: communication
description: "P6-A 涌现通信：Lazaridou 式指称博弈演示语义协议形成，并对世界内信号通道做 off/on 配对消融（个体奖励+共享策略，诚实报告 null/negative）"

world:
  width: 256
  height: 160
  seed: 0
  # 稀缺世界：食物再生率降到 base 的一半，让觅食行为/效率差异更可测
  food_regrow_per_s: 0.006

swarm:
  initial_population: 120
  capacity_hard: 3000

policy:
  kind: neural
  hidden: 32
  lr: 0.02
  gamma: 0.96
  batch_size: 512
  epochs_per_episode: 2

# 隔离通信通道：关闭社交机制，避免 barter/teaching 混淆 off/on 对照
social:
  enabled: false

comm:
  enabled: true
  n_symbols: 4
  radius: 6.0
  message_cost: 0.0
  seed: 0
  train: true          # 训练阶段 sender 从群体奖励学习；评估协议里改为 false（冻结）
  lr: 0.05
  batch_size: 128
  epochs: 1

memory:
  enabled: false

run:
  seconds: 30.0        # 训练 rollout 默认时长（协议参数可覆盖）
  dt: 0.05
  daylight: 0.8
  seeds: [0, 1, 2, 3, 4]
  eval_seconds: 60.0
  output_dir: experiments/results
  save_models: true

protocol_params:
  # ---- Part A：控制指称博弈（语义协议能否涌现）----
  cue_dim: 4
  game_n_symbols: 4
  game_seeds: [0, 1, 2, 3, 4]
  game_episodes: 400
  game_batch: 64
  game_eval_n: 2000
  game_lr: 0.5
  game_hidden: 32
  # ---- Part B：世界内信号通道 off/on 配对消融 ----
  train_seeds: [1000, 1001, 1002]
  train_episodes: 6
  train_episode_seconds: 30.0
  train_policy_seed: 7
  sender_seed: 12345
  eval_seeds: [2000, 2001, 2002, 2003, 2004]
  eval_seconds: 60.0
