# P6-B 记忆/反思消融：稀缺世界 + 配对种子（去 LLM 生成式记忆）
#
# 稀缺设定：小地图（128x80，食物总量约为 base 的 1/4）+ 极低再生
# （food_regrow_per_s=5e-05）+ 高代谢（0.04/s），制造真实的饥饿压力：
# 个体必须持续移动找食物，长程"往哪个方向找到过食物"的记忆才有兑现空间。
# 关社会层以隔离记忆机制（避免技能/交易/继承混入处理效应）。
name: p6_memory
protocol: memory_ablation
description: >-
  P6-B 去 LLM 生成式记忆与反思：记忆流（新近×重要×相关检索）+ 周期反思，
  配对种子消融 off / recency / full / full+reflection（稀缺世界，128x80）。

world:
  width: 128
  height: 80
  seed: 0
  food_regrow_per_s: 0.00005
  forest_spread_per_s: 0.0002

swarm:
  initial_population: 120
  metabolism_per_s: 0.04
  bite_size: 0.35
  move_speed: 3.0
  wander: 0.55

policy:
  kind: neural
  hidden: 32
  lr: 0.02
  gamma: 0.96
  batch_size: 512
  epochs_per_episode: 2
  normalize_advantage: true
  grad_clip: 0.5

social:
  enabled: false

comm:
  enabled: false

memory:
  enabled: true
  capacity: 24
  recency_halflife_s: 30.0
  weight_recency: 1.0
  weight_importance: 1.0
  weight_relevance: 1.0
  top_k: 3
  reflection_every_s: 20.0
  reflection_min_events: 6
  seed: 0

run:
  seconds: 40.0
  dt: 0.05
  seeds: [0, 1, 2]
  eval_seconds: 40.0
  output_dir: experiments/results
  save_models: true

protocol_params:
  train_episodes: 3
  train_seconds: 40.0
  train_seeds: [1000, 1001, 1002]
  eval_seeds: [0, 1, 2]
  eval_seconds: 40.0
  policy_seed: 7
  reflection_every_s: 20.0
  hidden: 32
