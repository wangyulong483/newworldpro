# 基础配置（被各实验 YAML 用 _base 继承；P5）
name: base
protocol: learning_compare
description: newworld 基础实验配置（其他配置继承本文件）

world:
  width: 256
  height: 160
  seed: 0
  ocean_margin: 6
  noise_scale: 64
  sea_level: 0.42
  mountain_level: 0.74
  snow_level: 0.86
  food_regrow_per_s: 0.012
  forest_spread_per_s: 0.0004

swarm:
  initial_population: 120
  capacity_hard: 3000
  metabolism_per_s: 0.010
  bite_size: 0.35
  mature_age_s: 12.0
  breed_cooldown_s: 14.0
  breed_food_threshold: 0.12
  breed_hunger_threshold: 0.55
  breed_probability_per_s: 0.10
  old_age_s: 90.0
  old_age_hazard_per_s: 0.05
  move_speed: 3.0
  wander: 0.55
  forage_hunger: 0.95

policy:
  kind: rule
  seed: 0
  hidden: 32
  lr: 0.02
  gamma: 0.96
  batch_size: 512
  epochs_per_episode: 2
  normalize_advantage: true
  grad_clip: 0.5

social:
  enabled: true
  enable_barter: true
  barter_gap: 0.30
  barter_transfer: 0.15
  barter_radius: 2.5
  barter_interval_s: 1.0
  enable_teaching: true
  teach_radius: 4.0
  teach_chance_per_s: 0.06
  teach_interval_s: 2.0
  enable_inheritance: true
  inherit_radius: 12.0
  initial_skill_rate: 0.08

comm:
  enabled: false
  n_symbols: 4
  radius: 6.0
  message_cost: 0.0
  seed: 0
  train: true
  lr: 0.05
  batch_size: 256
  epochs: 1

memory:
  enabled: false
  capacity: 24
  recency_halflife_s: 30.0
  weight_recency: 1.0
  weight_importance: 1.0
  weight_relevance: 1.0
  top_k: 3
  reflection_every_s: 20.0
  reflection_min_events: 6
  seed: 0

run:
  seconds: 120.0
  dt: 0.05
  daylight: 0.8
  seeds: [0, 1, 2, 3, 4]
  eval_seconds: 120.0
  output_dir: experiments/results
  save_models: true
